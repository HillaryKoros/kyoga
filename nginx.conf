server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Permissive CORS (GET only) so the COGs can be loaded across origins if hosted separately.
    add_header Access-Control-Allow-Origin  "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Range, If-None-Match" always;
    add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges" always;

    # CORS preflight
    if ($request_method = OPTIONS) {
        return 204;
    }

    # Redirect bare root to the app path.
    location = / {
        return 302 /kyoga/;
    }

    # SPA fallback under /kyoga/.
    location /kyoga/ {
        try_files $uri $uri/ /kyoga/index.html;
    }

    # COGs: long-cache, immutable. nginx supports byte-range requests by default.
    location /kyoga/data_cog/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header Access-Control-Allow-Origin "*" always;
        add_header Accept-Ranges bytes;
    }

    # Vector data — moderate cache.
    location /kyoga/data_vector/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header Access-Control-Allow-Origin "*" always;
    }

    # JS/CSS bundles produced by Vite are content-hashed; safe to cache forever.
    location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # gzip text-y assets.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;
}
